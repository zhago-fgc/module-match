<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match — Cockpit</title>
    <link rel="stylesheet" href="/assets/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/cockpit.css" />
    <link rel="stylesheet" href="index.css" />
    <script src="/assets/theme.js"></script>
    <script src="/assets/combobox.js"></script>
  </head>
  <body>
    <div class="cockpit-page">
      <h1>Match</h1>

      <h2 class="mt-4">Preview</h2>
      <details class="preview-panel" open>
        <summary>Show preview</summary>
        <div class="preview-frame mb-2">
          <iframe id="overlay-preview"></iframe>
        </div>
      </details>
      <h3>Embed</h3>
      <div class="field-row mb-3">
        <select id="skin-select" class="form-select">
          <option value="">Default overlay</option>
        </select>
      </div>
      <input
        id="embed-url"
        class="form-control font-monospace mb-4"
        readonly
        onclick="this.select()"
      />

      <h2>Edit</h2>
      <form id="form">
        <div class="field-row mb-3">
          <select id="game-select" class="form-select">
            <option value="">— no game (free-text team) —</option>
          </select>
        </div>
        <div class="sides mb-3">
          <fieldset>
            <legend>Side 1</legend>
            <div class="score-row mb-2">
              <div class="score-stepper">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="side-0-score-down">
                  −
                </button>
                <span class="score-value" id="side-0-score">0</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="side-0-score-up">
                  +
                </button>
              </div>
              <button
                type="button"
                class="btn btn-outline-success btn-sm winner-btn"
                id="side-0-winner"
                title="Click again to unset"
              >
                Declare winner
              </button>
              <label class="from-losers-label">
                <input type="checkbox" id="side-0-from-losers" />
                Loser
              </label>
            </div>
            <div class="field-label">Participants</div>
            <div class="participant-list" id="side-0-participants"></div>
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm add-character hidden"
              id="side-0-add-participant"
            >
              + Participant
            </button>
          </fieldset>
          <fieldset>
            <legend>Side 2</legend>
            <div class="score-row mb-2">
              <div class="score-stepper">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="side-1-score-down">
                  −
                </button>
                <span class="score-value" id="side-1-score">0</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="side-1-score-up">
                  +
                </button>
              </div>
              <button
                type="button"
                class="btn btn-outline-success btn-sm winner-btn"
                id="side-1-winner"
                title="Click again to unset"
              >
                Declare winner
              </button>
              <label class="from-losers-label">
                <input type="checkbox" id="side-1-from-losers" />
                Loser
              </label>
            </div>
            <div class="field-label">Participants</div>
            <div class="participant-list" id="side-1-participants"></div>
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm add-character hidden"
              id="side-1-add-participant"
            >
              + Participant
            </button>
          </fieldset>
        </div>
        <div class="field-row mb-3">
          <input id="round" class="form-control" placeholder="Round (e.g. Grand Finals)" />
          <input
            id="best-of"
            class="form-control"
            type="number"
            min="1"
            value="3"
            placeholder="Bo"
          />
        </div>
        <div class="field-row">
          <button type="submit" class="btn btn-primary">Update overlay</button>
          <button type="button" class="btn btn-outline-secondary" id="swap-sides">⇄ Swap sides</button>
          <button type="button" class="btn btn-outline-danger" id="clear-match">Clear</button>
        </div>
      </form>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
